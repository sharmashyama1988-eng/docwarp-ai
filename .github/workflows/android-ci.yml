name: DocWarp AI Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install NDK/CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Verify or Download Essential ML Weights
        run: |
          if [ -f "download_models.sh" ]; then
            chmod +x download_models.sh
            ./download_models.sh || echo "Pre-trained models download step finished or skipped."
          fi

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: docwarp-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
